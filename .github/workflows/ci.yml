name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Live-fleet guardrails (WorkDrive, catalog ×, multi-CRM)
        run: npm run test:fleet
      - name: Full unit tests
        run: npm test
