# Continuous deploy — every push to master ships a new release to all users.
# Builds .deb (+ latest.json), publishes GitHub Release. Clients auto-update.
# No fragmented installs: latest always comes from GitHub Releases.

name: Deploy Aspera Hub

on:
  push:
    branches: [master, main]
    paths-ignore:
      # Website/docs-only pushes must not stamp a new .deb release.
      - 'website/**'
      - '.github/workflows/website.yml'
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes shown to users'
        required: false
        default: ''

concurrency:
  group: deploy-asperadock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install system deps for .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot dpkg

      - name: Install npm deps
        run: npm ci

      - name: Read release version from package.json
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.json version must be strict semver (x.y.z), got: $VERSION"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release from package.json: v${VERSION}"

      - name: Build .deb
        run: npm run make -- --targets @electron-forge/maker-deb

      - name: Publish GitHub Release + update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          MSG="${NOTES:-}"
          if [ -z "$MSG" ]; then
            MSG=$(git log -1 --pretty=%s)
          fi
          node scripts/publish-update.mjs --notes "$MSG"

      - name: Summary
        run: |
          {
            echo "## Deployed Aspera Hub \`${{ steps.ver.outputs.tag }}\`"
            echo ""
            echo "All company PCs will pick this up via auto-update."
            echo ""
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
            echo "- Feed: https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"
